[package]
name = "flux-render"
version = "0.2.2"
license = "GPL-3.0-or-later"
description = "Draws the video frames on an output window through the GPU (wgpu)"
edition = "2024"

[dependencies]
thiserror = "2.0.21"
wgpu = "30"
pollster = "0.4"
font8x8 = "0.3.1"

[dev-dependencies]
# Checks the shader without a GPU.
naga = { version = "30", features = ["wgsl-in"] }
