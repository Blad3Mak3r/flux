[package]
name = "flux-voice"
version = "0.2.0"
license = "GPL-3.0-or-later"
edition = "2024"
description = "ElevenLabs speech generation without application or playback dependencies"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
