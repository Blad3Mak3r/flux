[package]
name = "flux-engine"
version = "0.2.0"
description = "Real-time engine: transport, LTC and MTC, mixer, cues and the audio and MIDI outputs"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
flux-core = { path = "../flux-core" }
flux-project = { path = "../flux-project" }
flux-audio = { path = "../flux-audio" }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
cpal = "0.18.2"
midir = "0.11.1"

# Extra audio drivers the picker offers next to the system's default one (ALSA, WASAPI, CoreAudio).
# JACK loads libjack at run time, so it needs nothing installed to start.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire", "jack"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18.2", features = ["jack"] }

# ASIO is the driver most professional interfaces ship. The SDK it builds against is in
# third_party/asiosdk (GPLv3 option of Steinberg's dual licence); the build also needs libclang and
# MSVC. See docs/audio-routing.md.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", features = ["jack", "asio"] }

[dev-dependencies]
serde_json = "1"
