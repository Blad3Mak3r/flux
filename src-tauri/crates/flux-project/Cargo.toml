[package]
name = "flux-project"
version = "0.1.0"
description = "The .fxtc project: model, archive, migrations and the editing session"
edition = "2024"

[dependencies]
flux-core = { path = "../flux-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
