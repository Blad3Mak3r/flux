[workspace]
members = ["crates/*"]

[package]
name = "flux-timecode"
version = "0.2.2"
license = "GPL-3.0-or-later"
description = "Timecode track editor and show-control desktop app (MTC / LTC)"
authors = ["Juan Luis Caro"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flux_timecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flux-voice = { path = "crates/flux-voice" }
keyring = { version = "4.2", features = ["v1"] }
tempfile = "3.27.0"
flux-core = { path = "crates/flux-core" }
flux-project = { path = "crates/flux-project" }
flux-audio = { path = "crates/flux-audio" }
flux-engine = { path = "crates/flux-engine" }
flux-video = { path = "crates/flux-video" }
flux-capture = { path = "crates/flux-capture" }
flux-render = { path = "crates/flux-render" }
flux-text = { path = "crates/flux-text" }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
# Where the app data folder is, before Tauri can say (see `graphics.rs`).
dirs = "7"
tauri-plugin-updater = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# The output monitor draws and encodes a picture many times a second: unoptimized, that alone
# takes most of a frame in `tauri dev`.
[profile.dev.package.flux-render]
opt-level = 3

# A text block is drawn pixel by pixel when it changes: its glyphs are drawn by these.
[profile.dev.package.flux-text]
opt-level = 3

[profile.dev.package.ab_glyph]
opt-level = 3

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3

[profile.dev.package.owned_ttf_parser]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
