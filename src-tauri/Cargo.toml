[workspace]
members = ["crates/*"]

[package]
name = "flux-timecode"
version = "0.1.0"
description = "Timecode track editor and show-control desktop app (MTC / LTC)"
authors = ["Juan Luis Caro"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flux_timecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flux-core = { path = "crates/flux-core" }
flux-project = { path = "crates/flux-project" }
flux-audio = { path = "crates/flux-audio" }
flux-engine = { path = "crates/flux-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.21"
log = { version = "0.4", features = ["std"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
