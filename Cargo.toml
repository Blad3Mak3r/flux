[package]
name = "flux"
version = "0.1.1"
edition = "2024"
description = "A lightweight real-time bridge for routing lighting data between protocols and interfaces."
license = "MIT"
repository = "https://github.com/Blad3Mak3r/flux"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libftd2xx = { version = "0.33.1", features = ["static"] }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.10.1", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2.3.4", features = ["tray-icon"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tauri-build = "2.5.3"
