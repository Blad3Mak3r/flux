[package]
name = "flux"
version = "0.1.0"
edition = "2024"
description = "A lightweight real-time bridge for routing lighting data between protocols and interfaces."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Blad3Mak3r/flux"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libftd2xx = { version = "0.33.1", features = ["static"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = { version = "0.26.0", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
tao = "0.37.1"
