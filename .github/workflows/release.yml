name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version increment
        required: true
        type: choice
        options: [initial, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')
          if LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null); then
            [ "${{ inputs.version_bump }}" != initial ] || { echo "::error::initial is only valid before the first release"; exit 1; }
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            case "${{ inputs.version_bump }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          else
            [ "${{ inputs.version_bump }}" = initial ] || { echo "::error::Choose initial for the first release"; exit 1; }
            VERSION="$CURRENT"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Update release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          node -e 'const fs=require("fs"); for (const path of ["tauri.conf.json", "ui/package.json"]) { const json=JSON.parse(fs.readFileSync(path)); json.version=process.env.VERSION; fs.writeFileSync(path, JSON.stringify(json, null, 2)+"\n"); }'
          npm install --prefix ui --package-lock-only --ignore-scripts
          npm ci --prefix ui
          npm run build --prefix ui
          cargo check
          test "$(node -p 'require("./tauri.conf.json").version')" = "$VERSION"
          grep -A2 '^name = "flux"' Cargo.lock | grep -q "version = \"$VERSION\""
      - name: Commit version and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock tauri.conf.json ui/package.json ui/package-lock.json
          git commit --allow-empty -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main "$TAG"

  bundle:
    name: ${{ matrix.name }} bundle
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            bundles: nsis,msi
            artifacts: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - name: Linux
            runner: ubuntu-latest
            bundles: appimage,deb
            artifacts: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2
      - run: npm ci --prefix ui
      - name: Build native bundles
        run: ui/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: flux-${{ needs.prepare.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: [prepare, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**
