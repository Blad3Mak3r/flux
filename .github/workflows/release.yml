name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version increment
        required: true
        type: choice
        options: [initial, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from the main branch."
          exit 1
      - uses: actions/checkout@v5
      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')
          if LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null); then
            [ "${{ inputs.version_bump }}" != initial ] || { echo "::error::initial is only valid before the first release"; exit 1; }
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            case "${{ inputs.version_bump }}" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          else
            [ "${{ inputs.version_bump }}" = initial ] || { echo "::error::Choose initial for the first release"; exit 1; }
            VERSION="$CURRENT"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }} bundle
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            bundles: nsis,msi
            artifacts: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - name: Linux
            runner: ubuntu-22.04
            bundles: appimage,deb
            artifacts: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2
      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ needs.prepare.outputs.version }}"
      - run: npm ci --prefix ui
      - name: Build native bundles
        run: ui/node_modules/.bin/tauri build --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@v4
        with:
          name: flux-${{ needs.prepare.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: [prepare, bundle]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ needs.prepare.outputs.version }}"
      - name: Commit version and tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock tauri.conf.json ui/package.json ui/package-lock.json
          git commit --allow-empty -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main "$TAG"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**
