name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional HTTPS origin for dry-run installers
        type: string

permissions:
  contents: read

env:
  RELEASE_BASE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.base_url) || vars.RELEASE_BASE_URL || (github.event_name == 'workflow_dispatch' && 'https://releases.example.invalid') || '' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            tag="v$(node -p 'require("./package.json").version')"
          fi
          node scripts/release.mjs validate "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev minisign
      - run: npm run typecheck && npm test
      - name: Check and test Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets
          cargo test --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - run: npm ci
      - name: Configure the public updater endpoint
        run: node scripts/release.mjs validate "$TAG" release-config.json
      - name: Build and sign installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --target "$TARGET" --bundles "$BUNDLES" --config release-config.json -- --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb*
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm*

  prepare:
    name: Prepare and verify signatures
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: incoming
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Collect public release notes
        run: |
          touch release-notes.txt
          if [[ "$GITHUB_EVENT_NAME" == push && "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > release-notes.txt
          fi
      - run: node scripts/release.mjs prepare "$TAG" incoming prepared release-notes.txt
      - run: node scripts/release.mjs dry-run "$TAG" prepared
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          path: prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish, verify public downloads, and promote
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, prepare]
    runs-on: ubuntu-22.04
    environment: stable
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: prepared
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Publish verified release to R2
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: node scripts/release.mjs publish "$TAG" prepared
