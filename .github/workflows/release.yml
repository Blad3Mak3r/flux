name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release (for example 1.2.0)
        required: true
        type: string
      dry_run:
        description: Build and verify without creating a tag or publishing
        type: boolean
        default: false
      base_url:
        description: Optional HTTPS origin for dry-run installers
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BASE_URL: ${{ (inputs.dry_run && inputs.base_url) || vars.RELEASE_BASE_URL || (inputs.dry_run && 'https://releases.example.invalid') || '' }}

jobs:
  version-pr:
    name: Open version pull request
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require main for a stable release
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Select main for a stable release, or enable dry_run."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Commit the version and open its pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs set-version "$RELEASE_VERSION"
          tag="v$RELEASE_VERSION"
          RELEASE_BASE_URL="${RELEASE_BASE_URL:-https://releases.example.invalid}" node scripts/release.mjs validate "$tag"
          existing=$(git ls-remote --refs origin "refs/tags/$tag")
          if [[ -n "$existing" ]]; then
            echo "::error::$tag already exists."
            exit 1
          fi

          branch="chore/release-$tag"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          existing=$(git ls-remote --refs origin "refs/heads/$branch")
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin "refs/heads/$branch"
            if [[ "$(git rev-parse FETCH_HEAD^{tree})" != "$(git write-tree)" ]]; then
              echo "::error::$branch already contains different changes."
              exit 1
            fi
          else
            git switch -c "$branch"
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): bump version to $RELEASE_VERSION"
            git push origin "HEAD:refs/heads/$branch"
          fi

          pr=$(gh pr list --state open --base main --head "$branch" --json url --jq '.[0].url // empty')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create --base main --head "$branch" --title "chore(release): bump version to $RELEASE_VERSION" \
              --body "$(printf '## Summary\n\nPrepare Flux Timecode %s for release. Merging starts the stable release workflow.\n\n## Changes\n\nSynchronize the npm, Cargo and Tauri versions.\n\n## Validation\n\nVerified that all five version files match. Build and signature checks run on main before publication.\n' "$RELEASE_VERSION")")
          fi
          echo "Version pull request $pr" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release.mjs set-version "$RELEASE_VERSION"
            git add package-lock.json src-tauri/Cargo.lock
            tag="v$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            previous=$(git show "$BEFORE:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0)).version')
            version=$(node -p 'require("./package.json").version')
            if [[ "$previous" == "$version" ]]; then
              echo "The app version did not change."
              exit 0
            fi
            node --input-type=module -e '
              import { compareVersions } from "./scripts/release.mjs";
              if (compareVersions(process.argv[1], process.argv[2]) <= 0) {
                throw new Error("Release version must increase on main");
              }
            ' "$version" "$previous"
            tag="v$version"
          elif ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$tag must point to a commit on main."
            exit 1
          fi
          node scripts/release.mjs validate "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag != ''
        run: npm ci
      - if: steps.version.outputs.tag != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri and audio build dependencies
        if: steps.version.outputs.tag != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev minisign
      - if: steps.version.outputs.tag != ''
        run: npm run typecheck && npm test
      - name: Check and test Rust
        if: steps.version.outputs.tag != ''
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets
          cargo test --locked
      - if: steps.version.outputs.tag != ''
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    if: needs.validate.outputs.tag != ''
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - name: Set the release version and updater endpoint
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release.mjs set-version "$RELEASE_VERSION"
            git add package-lock.json src-tauri/Cargo.lock
          fi
          node scripts/release.mjs validate "$TAG" release-config.json
      - run: npm ci
      - name: Build and sign installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --target "$TARGET" --bundles "$BUNDLES" --config release-config.json -- --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb*
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm*

  prepare:
    name: Prepare and verify signatures
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: incoming
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Set the version and collect public release notes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release.mjs set-version "$RELEASE_VERSION"
          fi
          touch release-notes.txt
          if [[ "$GITHUB_REF" == refs/tags/* && "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > release-notes.txt
          fi
      - run: node scripts/release.mjs prepare "$TAG" incoming prepared release-notes.txt
      - run: node scripts/release.mjs dry-run "$TAG" prepared
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          path: prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish, verify public downloads, and promote
    if: github.event_name == 'push'
    needs: [validate, prepare]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment: stable
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: prepared
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify release ancestry and tag the tested commit
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tested release commit must be on main."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # This creates the tag or succeeds if it already points to the tested commit.
            # The built-in token does not start another workflow run.
            git push origin "HEAD:refs/tags/$TAG"
          fi
      - name: Publish verified release to R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: node scripts/release.mjs publish "$TAG" prepared
