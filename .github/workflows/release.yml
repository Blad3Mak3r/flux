name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release (for example 1.2.0)
        required: true
        type: string
      dry_run:
        description: Build and verify without creating a tag or publishing
        type: boolean
        default: false
      base_url:
        description: Optional HTTPS origin for dry-run installers
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BASE_URL: ${{ (inputs.dry_run && inputs.base_url) || vars.RELEASE_BASE_URL || (inputs.dry_run && 'https://releases.example.invalid') || '' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Select main for a stable release, or enable dry_run."
              exit 1
            fi
            node scripts/release.mjs set-version "$RELEASE_VERSION"
            git add package-lock.json src-tauri/Cargo.lock
            tag="v$RELEASE_VERSION"
          elif ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$tag must point to a commit on main."
            exit 1
          fi
          node scripts/release.mjs validate "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev minisign
      - run: npm run typecheck && npm test
      - name: Check and test Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets
          cargo test --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri and audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - name: Set the release version and updater endpoint
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release.mjs set-version "$RELEASE_VERSION"
            git add package-lock.json src-tauri/Cargo.lock
          fi
          node scripts/release.mjs validate "$TAG" release-config.json
      - run: npm ci
      - name: Build and sign installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --target "$TARGET" --bundles "$BUNDLES" --config release-config.json -- --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb*
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm*

  prepare:
    name: Prepare and verify signatures
    needs: [validate, build]
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: incoming
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Set the version and collect public release notes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release.mjs set-version "$RELEASE_VERSION"
          fi
          touch release-notes.txt
          if [[ "$GITHUB_EVENT_NAME" == push && "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > release-notes.txt
          fi
      - run: node scripts/release.mjs prepare "$TAG" incoming prepared release-notes.txt
      - run: node scripts/release.mjs dry-run "$TAG" prepared
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-release
          path: prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish, verify public downloads, and promote
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
    needs: [validate, prepare]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment: stable
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: prepared
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify release ancestry
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tested revision must be on main."
            exit 1
          fi
      - name: Push the tested version to main and create its tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/release.mjs set-version "$RELEASE_VERSION"
          node scripts/release.mjs dry-run "$TAG" prepared
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          tag_ref="refs/tags/$TAG"
          existing=$(git ls-remote --refs origin "$tag_ref")
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin "$tag_ref"
            if [[ "$(git rev-parse FETCH_HEAD^{tree})" != "$(git write-tree)" ||
                  "$(git rev-parse FETCH_HEAD^)" != "$GITHUB_SHA" ]] ||
                ! git merge-base --is-ancestor FETCH_HEAD origin/main; then
              echo "::error::$TAG does not identify the tested version commit on main."
              exit 1
            fi
          else
            if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
              echo "::error::main advanced while this release was building. Start a new run from main."
              exit 1
            fi
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): bump version to $RELEASE_VERSION"
            # The built-in token does not start another run from this push.
            git push --atomic origin HEAD:refs/heads/main "HEAD:$tag_ref"
          fi
      - name: Publish verified release to R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: node scripts/release.mjs publish "$TAG" prepared
