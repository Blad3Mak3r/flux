name: Pages

# Publishes the public site to GitHub Pages: the landing page (site/) at /flux/ and the docs (docs/, built with
# VitePress) at /flux/docs/. It runs when site/ or docs/ change on main (a release moves main to the version commit,
# which also updates the version shown on the page) or by hand.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions. See docs/landing-page.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm run build --prefix docs
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r docs/.vitepress/dist _site/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
