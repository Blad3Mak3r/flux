name: Linux system dependencies
description: Packages Tauri v2 and the audio and MIDI crates need to compile on Ubuntu.

runs:
  using: composite
  steps:
    - name: Install packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # Tauri v2: the webview, GTK and the bundler's tools.
        # cpal: ALSA, JACK and PipeWire headers (PipeWire's bindings also need libclang).
        # keyring: D-Bus. midir: ALSA.
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev libxdo-dev libdbus-1-dev \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libspa-0.2-dev \
          clang libclang-dev
